<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kỷ niệm lớp</title>
  <style>
    :root {
      --bg: #12131a;
      --card: #1d1f2b;
      --text: #f3f4f8;
      --accent: #ff6b8b;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }
    .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-pink {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
    }
    .box {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }
    .photo-card {
      background: #151722;
      border-radius: 12px;
      padding: 10px;
    }
    .photo-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      background: #282c3f;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .form-row input {
      flex: 1 1 180px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #12141d;
      color: var(--text);
    }
    .note {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div style="color: var(--accent); font-size: 14px;">✦ Kỷ niệm lớp ✦</div>
        <h1 style="margin: 4px 0 0;">Lớp Của Chúng Mình</h1>
      </div>
      <button class="btn" id="colorBtn">⚙ Đổi màu chủ đạo</button>
    </div>

    <div class="box">
      <h2 style="margin: 0 0 12px; font-size: 18px;">📷 Ảnh kỷ niệm</h2>
      <div class="photo-grid">
        <div class="photo-card">
          <img src="anh1.jpg" alt="Ảnh kỷ niệm" onerror="this.style.opacity='0.2'" />
          <p style="margin: 8px 0 0; font-size: 14px;">Một phần ký ức đang được thêm vào</p>
        </div>
      </div>
    </div>

    <div class="box">
      <h2 style="margin: 0 0 12px; font-size: 18px;">✦ Nhắn nhau</h2>
      <form class="form-row" id="chatForm">
        <input type="text" id="nameInput" placeholder="Tên bạn..." required />
        <input type="text" id="msgInput" placeholder="Nhập lời nhắn..." required />
        <button class="btn btn-pink" type="submit">Gửi</button>
      </form>
      <div id="chatList"></div>
    </div>
  </div>

  <script>
    const KEY = "notes_lop_hoc_v1";
    const chatForm = document.getElementById("chatForm");
    const chatList = document.getElementById("chatList");

    function esc(t) {
      return t.replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function render() {
      const items = JSON.parse(localStorage.getItem(KEY) || "[]");
      chatList.innerHTML = items
        .map(x => `<div class="note"><strong>${esc(x.name)}:</strong> ${esc(x.msg)}</div>`)
        .join("");
    }

    chatForm.addEventListener("submit", e => {
      e.preventDefault();
      const name = document.getElementById("nameInput").value.trim();
      const msg = document.getElementById("msgInput").value.trim();
      if (!name || !msg) return;
      const items = JSON.parse(localStorage.getItem(KEY) || "[]");
      items.unshift({ name, msg });
      localStorage.setItem(KEY, JSON.stringify(items));
      chatForm.reset();
      render();
    });

    const colors = ["#ff6b8b", "#4ea8de", "#7bd389", "#f4a261"];
    let idx = 0;
    document.getElementById("colorBtn").addEventListener("click", () => {
      idx = (idx + 1) % colors.length;
      document.documentElement.style.setProperty("--accent", colors[idx]);
    });

    render();
  </script>
</body>
</html>
