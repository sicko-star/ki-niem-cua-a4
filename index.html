<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A2 · 2024–2027</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 25%, rgba(168, 56, 178, 0.55), transparent 45%),
        radial-gradient(circle at 75% 65%, rgba(34, 82, 168, 0.55), transparent 50%),
        linear-gradient(135deg, #1b0c2e 0%, #120921 55%, #091329 100%);
      overflow-x: hidden;
    }
    .header {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 20px 16px 8px;
    }
    .tag {
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.85;
    }
    h1 {
      margin: 4px 0 0;
      font-size: clamp(26px, 4vw, 44px);
      font-style: italic;
      text-shadow: 0 0 18px rgba(255, 190, 255, 0.45);
    }
    .wall {
      position: relative;
      width: 100%;
      min-height: 82vh;
      padding: 20px;
    }
    .polaroid {
      position: absolute;
      background: #f7f7f9;
      padding: 6px 6px 14px;
      border-radius: 3px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      transition: transform 0.2s ease, z-index 0.2s ease;
    }
    .polaroid:hover {
      transform: scale(1.12) rotate(0deg) !important;
      z-index: 20;
    }
    .polaroid img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #2c2440;
    }
    .student-name {
      position: absolute;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(18px, 2.4vw, 32px);
      color: #fff;
      text-shadow: 0 0 14px rgba(255, 160, 255, 0.85), 0 2px 10px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="tag">✦ KỶ NIỆM LỚP ✦</div>
    <h1>A4 · 2025–2028</h1>
  </div>

  <div class="wall" id="wall"></div>

  <script>
    const wall = document.getElementById("wall");

    // Sửa danh sách tên học sinh và vị trí (x, y tính theo %)
    const names = [
      { text: "Trần Anh Kiều", x: 6, y: 18 },
      { text: "Nguyễn Văn Bắc", x: 48, y: 42 },
      { text: "...", x: 14, y: 72 }
    ];

    // Sửa tên file ảnh cho khớp với ảnh bạn bỏ vào thư mục web-lop
    const photos = [
      { src: "a1.jpg", x: 20, y: 8, w: 150, h: 105, rot: -6 },
      { src: "a2.jpg", x: 76, y: 6, w: 170, h: 110, rot: 5 },
      { src: "a3.jpg", x: 12, y: 36, w: 130, h: 115, rot: -4 },
      { src: "a4.jpg", x: 42, y: 24, w: 165, h: 110, rot: 3 },
      { src: "a5.jpg", x: 68, y: 28, w: 145, h: 105, rot: -5 },
      { src: "a6.jpg", x: 28, y: 54, w: 140, h: 100, rot: 6 },
      { src: "a7.jpg", x: 78, y: 55, w: 160, h: 110, rot: -3 },
      { src: "a8.jpg", x: 56, y: 74, w: 185, h: 115, rot: 4 }
    ];

    photos.forEach(p => {
      const card = document.createElement("div");
      card.className = "polaroid";
      card.style.left = p.x + "%";
      card.style.top = p.y + "%";
      card.style.width = p.w + "px";
      card.style.height = p.h + "px";
      card.style.transform = `rotate(${p.rot}deg)`;

      const img = document.createElement("img");
      img.src = p.src;
      img.alt = "Kỷ niệm";
      img.onerror = () => { img.style.opacity = "0.25"; };

      card.appendChild(img);
      wall.appendChild(card);
    });

    names.forEach(n => {
      const el = document.createElement("div");
      el.className = "student-name";
      el.textContent = n.text;
      el.style.left = n.x + "%";
      el.style.top = n.y + "%";
      wall.appendChild(el);
    });
  </script>
</body>
</html>
