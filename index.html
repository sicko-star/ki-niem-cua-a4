<script>
    (function () {
      const wall = document.getElementById("wall");
      if (!wall) return;

      const gvs = [
        { t: "Trần Thị Anh Kiều", x: 5, y: 18 },
        { t: "Nguyễn Văn Bắc", x: 47, y: 44 },
        { t: "...", x: 16, y: 72 }
      ];

      const pics = [
        { s: "anh1.jpg", kieu: "ngang",     x: 20, y: 4,  r: -5 },
        { s: "anh2.jpg", kieu: "doc",       x: 38, y: 12, r: 4  },
        { s: "anh3.jpg", kieu: "ngang-lon", x: 74, y: 3,  r: 3  },
        { s: "anh4.jpg", kieu: "doc",       x: 6,  y: 34, r: -4 },
        { s: "anh5.jpg", kieu: "vuong",     x: 22, y: 44, r: 5  }
      ];

      const zoom = document.getElementById("zoom");
      const zoomImg = document.getElementById("zoomImg");

      pics.forEach(function (p) {
        const d = document.createElement("div");
        d.className = "card " + p.kieu;
        d.style.left = p.x + "%";
        d.style.top = p.y + "%";
        d.style.transform = "rotate(" + p.r + "deg)";

        const i = document.createElement("img");
        i.src = p.s;
        i.alt = "Kỷ niệm A4";
        i.onerror = function () {
          i.style.background = "#3b2d59";
          i.style.opacity = "0.6";
        };

        d.onclick = function () {
          if (zoom && zoomImg) {
            zoomImg.src = i.src;
            zoom.classList.add("open");
          }
        };

        d.appendChild(i);
        wall.appendChild(d);
      });

      if (zoom) {
        zoom.onclick = function () {
          zoom.classList.remove("open");
        };
      }

      gvs.forEach(function (g) {
        const e = document.createElement("div");
        e.className = "gv";
        e.textContent = g.t;
        e.style.left = g.x + "%";
        e.style.top = g.y + "%";
        wall.appendChild(e);
      });

      const btnChat = document.getElementById("btnChat");
      const boxChat = document.getElementById("boxChat");
      if (btnChat && boxChat) {
        btnChat.onclick = function () {
          boxChat.classList.toggle("open");
        };
      }

      const K = "a4_msg_v2";
      const f = document.getElementById("fChat");
      const l = document.getElementById("lChat");

      function show() {
        if (!l) return;
        const arr = JSON.parse(localStorage.getItem(K) || "[]");
        l.innerHTML = arr
          .map(function (x) {
            return '<div class="msg"><b>' + x.n + ":</b> " + x.m + "</div>";
          })
          .join("");
      }

      if (f) {
        f.onsubmit = function (e) {
          e.preventDefault();
          const nEl = document.getElementById("nIn");
          const mEl = document.getElementById("mIn");
          if (!nEl || !mEl) return;
          const arr = JSON.parse(localStorage.getItem(K) || "[]");
          arr.unshift({ n: nEl.value, m: mEl.value });
          localStorage.setItem(K, JSON.stringify(arr));
          f.reset();
          show();
        };
      }

      show();
    })();
  </script>
